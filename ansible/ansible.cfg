; ansible.cfg
;
; WHAT THIS FILE DOES:
; Local configuration Ansible reads automatically when you run
; `ansible-playbook` from this directory — no need to pass these as
; flags every time.
;
; WHY THIS MATTERS FOR LEARNING:
; `host_key_checking = False` is here for the same reason
; StrictHostKeyChecking=accept-new is in the inventory file: a brand
; new EC2 instance has a host key Ansible/SSH has never seen before,
; and without one of these settings your very first connection attempt
; would hang waiting for an interactive yes/no prompt Ansible can't
; answer. Fine for a personal lab; a real team environment would
; provision known_hosts properly instead (e.g. via the EC2 console's
; system log, which prints the host key fingerprint on first boot).

[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
